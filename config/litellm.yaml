model_list:
  # ── Session + worker models ─────────────────────────────────────────────
  # Any model_name here becomes selectable as a session or worker model.
  #   session: what your IDE's chat uses (the model you type into the IDE)
  #   worker:  Lore's background distillation/curation (see `ai-stack models`)
  #
  # Put your WORKER on a local model. The worker runs on every session
  # (distillation, curation, query expansion) so a cloud worker bills on every
  # session whether or not you chat. A local worker keeps that at zero. See
  # README "Model selection" for the quality floor per pipeline.
  #
  # To add a cloud model, copy a block and set the provider prefix:
  #   openai/gpt-4o        + api_key: os.environ/OPENAI_API_KEY
  #   anthropic/claude-... + api_key: os.environ/ANTHROPIC_API_KEY
  #
  # deepseek-v4-* are local aliases for the DeepSeek API, not names LiteLLM
  # knows, so it can't look up pricing and warns "not in built-in cost map".
  # That warning matters beyond noise: Lore reads cache-read cost to decide when
  # to escalate from raw context to compression (budget.targetCacheReadCostPerTurn).
  # With cache costs at 0 that heuristic always thinks cache is free. The values
  # below fill in cache pricing; they are the DeepSeek V3.2-style split (cache
  # read ~10x cheaper than a fresh input token). Update if your provider differs.
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      # USD per token. Placeholders only if you don't care about cost tracking.
      input_cost_per_token: 2.8e-7
      output_cost_per_token: 4.2e-7
      cache_read_input_token_cost: 2.8e-8
      cache_creation_input_token_cost: 2.8e-7

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      input_cost_per_token: 2.8e-7
      output_cost_per_token: 4.2e-7
      cache_read_input_token_cost: 2.8e-8
      cache_creation_input_token_cost: 2.8e-7

  # ── Local models (Ollama on the host) ───────────────────────────────────
  # Recommended for the WORKER: free per call, and distillation is a
  # summarization task that small models handle well.
  #
  # Ministral 3 8B Instruct is the suggested worker: non-thinking (so no
  # reasoning tokens burnt on a summarization task), 256K context (double
  # Llama 3.1 8B, so distillation segments and the curator's entry context get
  # split less often), and newer. Pull it with:
  #   ollama pull ministral-3:8b-instruct-2512-q4_K_M
  # Any tag of the family works; `ministral-3:8b` is the same weights at Q4.
  # Pair with {"curator": {"enabled": false}} — see README on quality floors.
  - model_name: ministral-3:8b
    litellm_params:
      model: ollama/ministral-3:8b
      api_base: http://host.docker.internal:11434
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
      cache_creation_input_token_cost: 0

  # Conservative alternative: older, smaller on disk (4.9GB vs 6.0GB) and
  # battle-tested, but half the context (128K) and no advantage otherwise.
  # Commented out because it must be pulled first
  # (`ollama pull llama3.1:8b`) — a missing model surfaces as a confusing
  # "Invalid model name" error at request time.
  # - model_name: llama3.1:8b
  #   litellm_params:
  #     model: ollama/llama3.1:8b
  #     api_base: http://host.docker.internal:11434
  #   model_info:
  #     input_cost_per_token: 0
  #     output_cost_per_token: 0
  #     cache_read_input_token_cost: 0
  #     cache_creation_input_token_cost: 0

  # qwen3:8b is a THINKING model: it emits reasoning before content, so a
  # short max_tokens returns 200 with empty content, and every worker call
  # wastes tokens reasoning about a summarization task. Usable as a session
  # model; not a good worker. Kept because it is a common local default.
  - model_name: qwen3:8b
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://host.docker.internal:11434
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
      cache_creation_input_token_cost: 0

  # Best local curation quality if you have the RAM (14B-class). Still local
  # and free. Uncomment after `ollama pull qwen2.5-coder:14b`.
  # - model_name: qwen2.5-coder:14b
  #   litellm_params:
  #     model: ollama/qwen2.5-coder:14b
  #     api_base: http://host.docker.internal:11434
  #   model_info:
  #     input_cost_per_token: 0
  #     output_cost_per_token: 0
  #     cache_read_input_token_cost: 0
  #     cache_creation_input_token_cost: 0

# Headroom compression is registered in litellm/entrypoint.py (see litellm/Dockerfile)
# — LiteLLM's YAML dotted-path callbacks register the class, not an instance,
# which breaks the async pre-call hook.
#
# No master_key: litellm runs auth-disabled (accepts any key) so lore's
# forwarded client keys work without a key database.
