services:
  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    container_name: ai-litellm
    ports:
      - "4000:4000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lore:
    image: ghcr.io/byk/lore:latest
    container_name: ai-lore
    ports:
      - "3207:3207"
    volumes:
      - ./config:/etc/lore
      - ./scripts:/scripts
      - lore_data:/var/lib/lore
    environment:
      - LORE_LLM_KEY=${LORE_LLM_KEY:-${OPENAI_API_KEY}}
      - LORE_CHAT_MODEL=${LORE_CHAT_MODEL:-claude-3-5-sonnet}
      - LORE_WORKER_MODEL=${LORE_WORKER_MODEL:-local-llama}
      - LORE_WORKER_API_KEY=${LORE_WORKER_API_KEY:-}
      - LORE_DEBUG=${LORE_DEBUG:-true}
    command: ["/bin/sh", "/scripts/entrypoint-lore.sh"]
    restart: unless-stopped

volumes:
  lore_data:
