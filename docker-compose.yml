services:
  litellm:
    build: ./litellm
    container_name: ai-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./config/litellm.yaml:/app/config.yaml
      # Headroom's HuggingFace model cache (kompress-v2-base) — host-side,
      # so a recreate doesn't re-download the compression model
      - ./data/headroom:/data/headroom
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # No LITELLM_MASTER_KEY on purpose: with it unset, litellm accepts any
      # key (local single-user stack — lore forwards the client's key, which
      # would otherwise be rejected as there is no key database).
      - HF_HOME=/data/headroom/hf
      # Headroom's CCR originals store — relocated onto the host mount
      - HEADROOM_CCR_SQLITE_PATH=/data/headroom/ccr_store.db
      - HEADROOM_UPDATE_CHECK=off
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lore:
    build: .
    container_name: ai-lore
    working_dir: /app
    ports:
      - "3207:3207"
    volumes:
      # Lore's memory (SQLite DB + embeddings) — host-side, survives teardown
      - ./data/lore:/root/.local/share/lore
      # cwd = repo root so .lore.md exports land in the repo, like the old host setup
      - .:/app
    environment:
      - LORE_UPSTREAM_OPENAI=${LORE_UPSTREAM_OPENAI:-http://litellm:4000/v1}
      - LORE_UPSTREAM_ANTHROPIC=${LORE_UPSTREAM_ANTHROPIC:-http://litellm:4000/v1}
      - LORE_WORKER_UPSTREAM=${LORE_WORKER_UPSTREAM:-http://litellm:4000/v1}
      # Worker model must exist in LiteLLM's model_list (config/litellm.yaml)
      - LORE_WORKER_MODEL=${LORE_WORKER_MODEL:-llama3.1:8b}
      # Worker -> LiteLLM calls use a dedicated key (any key works: auth is off)
      - LORE_WORKER_API_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master}
      - LORE_DEBUG=${LORE_DEBUG:-true}
    depends_on:
      - litellm
    restart: unless-stopped
