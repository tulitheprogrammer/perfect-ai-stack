services:
  litellm:
    build: ./litellm
    container_name: ai-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./config/litellm.yaml:/app/config.yaml
      # Headroom's HuggingFace model cache (kompress-v2-base) — host-side,
      # so a recreate doesn't re-download the compression model
      - ${AI_STACK_DATA_DIR:-./data}/headroom:/data/headroom
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # config/litellm.yaml reads the DeepSeek key as DEEPSEEK_API_KEY (the name
      # LiteLLM's own deepseek/ provider expects). OPENAI_API_KEY is the older
      # name from when this stack was OpenAI-first, so each falls back to the
      # other: either export keeps working, nothing needs re-exporting.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-${OPENAI_API_KEY}}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-${DEEPSEEK_API_KEY}}
      # No LITELLM_MASTER_KEY: Lore forwards the client's key, and with auth
      # disabled any key is accepted without a key database (local single-user
      # stack).
      # LiteLLM >=1.104 refuses to boot without a master key, so opt in to the
      # unset-key mode explicitly. Do NOT expose port 4000 beyond localhost:
      # this makes the proxy accept unauthenticated requests.
      - LITELLM_DANGEROUSLY_PERMIT_WEAK_OR_UNSET_MASTER_KEY=true
      - HF_HOME=/data/headroom/hf
      # Headroom's CCR originals store — relocated onto the host mount
      - HEADROOM_CCR_SQLITE_PATH=/data/headroom/ccr_store.db
      - HEADROOM_UPDATE_CHECK=off
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lore:
    build: .
    container_name: ai-lore
    working_dir: /app
    ports:
      - "3207:3207"
    # Docker's default /dev/shm is 64MB. The embedding model runs on ONNX; when
    # the native runtime can't load it, the gateway falls back to the bundled
    # threaded-WASM runtime, which needs shared memory and dies under 64MB —
    # leaving recall on FTS-only. 1GB removes that failure mode.
    shm_size: "1gb"
    volumes:
      # Lore's memory (SQLite DB + embeddings) — host-side, survives teardown
      - ${AI_STACK_DATA_DIR:-./data}/lore:/root/.local/share/lore
      # cwd (and .lore.md export target) = the project you ran start from, so
      # exports land in that repo (set AI_STACK_PROJECT_DIR under npx; defaults
      # to the stack dir so clones behave like before)
      - ${AI_STACK_PROJECT_DIR:-.}:/app
      # The embedding model (~137MB int8 ONNX) is downloaded on first use into
      # the gateway's .cache. Keeping that on the host means a recreate (or
      # `update`) reuses it instead of re-downloading, and a truncated download
      # caused by a killed container can't poison the image layer.
      - ${AI_STACK_DATA_DIR:-./data}/lore-cache:/usr/local/lib/node_modules/@loreai/gateway/.cache
    environment:
      # Bare roots, no trailing /v1: Lore appends the API path itself
      # (gateway builds `${upstreamAnthropic}/v1/models`), so a /v1 suffix
      # yields /v1/v1/messages (404) and /v1/v1/files (400).
      - LORE_UPSTREAM_OPENAI=${LORE_UPSTREAM_OPENAI:-http://litellm:4000}
      - LORE_UPSTREAM_ANTHROPIC=${LORE_UPSTREAM_ANTHROPIC:-http://litellm:4000}
      - LORE_WORKER_UPSTREAM=${LORE_WORKER_UPSTREAM:-http://litellm:4000}
      # Worker model must exist in LiteLLM's model_list (config/litellm.yaml).
      # qwen3:8b is the measured-best local model (scripts/eval-worker.sh): it
      # categorised all test facts correctly, where ministral-3:8b did not.
      # The openai/ provider ID selects the OpenAI protocol so worker calls
      # reach LiteLLM. Workers MUST use the same provider as the session:
      # cross-provider worker calls fail (wrong credentials / wrong API format).
      - LORE_WORKER_MODEL=${LORE_WORKER_MODEL:-openai/qwen3:8b}
      # Worker -> LiteLLM calls use a dedicated key (any key works: auth is off)
      - LORE_WORKER_API_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master}
      - LORE_DEBUG=${LORE_DEBUG:-true}
    depends_on:
      - litellm
    restart: unless-stopped
