# Shared LiteLLM model routing config for @pluginizer/ai-stack.
# Copied to ~/.config/ai-stack/config/litellm.yaml on `ai-stack init`.
# Customize model names, API keys, and model parameters here.

model_list:
  # Session Model -> DeepSeek API
  - model_name: v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_base: "https://api.deepseek.com"
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_base: "https://api.deepseek.com"
      api_key: "os.environ/OPENAI_API_KEY"

  # Worker Model -> Local Ollama (distillation/curation)
  - model_name: llama3.1:8b
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: "http://localhost:11434"
      num_ctx: 16384
    model_info:
      supports_function_calling: false
